<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="term-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#term-bg)"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="26" r="6" fill="#ef4444"/>
  <circle cx="50" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="26" r="6" fill="#10b981"/>
  <rect x="350" y="14" width="500" height="24" rx="6" fill="#1e293b"/>
  <text x="600" y="30" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">
    kidist@ubuntu-server: ~/backend-services (Node.js + Express + MySQL)
  </text>

  <!-- Left Side: Terminal CLI -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="560" height="620" rx="12" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    <text x="24" y="38" fill="#10b981" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14">&#9658; Ubuntu Linux LTS Backend Environment</text>
    
    <text x="24" y="80" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="12">
      kidist@ubuntu:~$ pm2 status
    </text>
    <rect x="24" y="95" width="512" height="110" rx="8" fill="#111827"/>
    <text x="40" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5">APP NAME      STATUS   PORT    CPU     MEM      UPTIME</text>
    <text x="40" y="150" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">auth-api      online   5000    0.2%    42.4mb   14d 8h</text>
    <text x="40" y="172" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">inventory-svc online   5001    0.1%    38.1mb   14d 8h</text>
    <text x="40" y="194" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">orders-stream online   5002    0.4%    51.9mb   14d 8h</text>

    <text x="24" y="240" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="12">
      kidist@ubuntu:~$ curl -I http://localhost:5000/api/v1/health
    </text>
    <text x="24" y="270" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12">HTTP/1.1 200 OK</text>
    <text x="24" y="292" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11.5">Content-Type: application/json; charset=utf-8</text>
    <text x="24" y="314" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11.5">X-Response-Time: 14.2ms</text>
    <text x="24" y="336" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="11.5">{"status":"healthy","database":"mysql-pool-connected"}</text>

    <text x="24" y="380" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="12">
      kidist@ubuntu:~$ mysql -u root -p -e "SHOW STATUS LIKE 'Threads_connected';"
    </text>
    <text x="24" y="410" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12">
      +-------------------+-------+
    </text>
    <text x="24" y="430" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12">
      | Variable_name     | Value |
    </text>
    <text x="24" y="450" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12">
      | Threads_connected | 24    | (Pool connection active)
    </text>
    <text x="24" y="470" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12">
      +-------------------+-------+
    </text>

    <!-- Cursor prompt -->
    <text x="24" y="530" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13">
      kidist@ubuntu:~/api-gateway$ <tspan fill="#38bdf8">node server.js</tspan> &#9608;
    </text>
  </g>

  <!-- Right Side: API & Architecture Diagram -->
  <g transform="translate(625, 80)">
    <rect x="0" y="0" width="535" height="620" rx="12" fill="#0d1526" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="38" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Architecture &amp; Endpoints</text>

    <!-- Node.js + Express layer -->
    <rect x="24" y="65" width="487" height="120" rx="8" fill="#111c33" stroke="#2563eb" stroke-width="1"/>
    <text x="44" y="95" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RESTful API Gateway (Express.js)</text>
    <text x="44" y="120" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">
      POST /api/auth/login · JWT Verification · RBAC
    </text>
    <text x="44" y="142" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">
      GET  /api/v1/records · Pagination · Rate Limiter
    </text>
    <text x="44" y="164" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">
      PUT  /api/v1/transactions · ACID Transactions
    </text>

    <!-- MySQL Relational DB Layer -->
    <rect x="24" y="210" width="487" height="175" rx="8" fill="#111c33" stroke="#059669" stroke-width="1"/>
    <text x="44" y="240" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">MySQL Database &amp; Stored Procedures</text>
    
    <text x="44" y="270" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      -- PL/SQL Stored Procedure with Transaction Block
    </text>
    <text x="44" y="292" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">
      CREATE PROCEDURE sp_ProcessOrder(IN p_id INT)
    </text>
    <text x="44" y="314" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
      BEGIN START TRANSACTION;
    </text>
    <text x="44" y="336" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
        UPDATE inventory SET stock = stock - 1;
    </text>
    <text x="44" y="358" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">
      COMMIT; END;
    </text>

    <!-- Key competencies -->
    <g transform="translate(24, 410)">
      <rect x="0" y="0" width="487" height="170" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">KEY BACKEND CAPABILITIES</text>
      
      <circle cx="30" cy="58" r="4" fill="#10b981"/>
      <text x="44" y="62" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Linux Ubuntu server administration &amp; process monitoring (PM2, systemd)</text>
      
      <circle cx="30" cy="90" r="4" fill="#38bdf8"/>
      <text x="44" y="94" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Relational database normalization (3NF), indexing, and query optimization</text>

      <circle cx="30" cy="122" r="4" fill="#a855f7"/>
      <text x="44" y="126" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">REST API security, token-based authentication, and structured validation</text>
    </g>
  </g>
</svg>
