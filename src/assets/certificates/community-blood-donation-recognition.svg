<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <defs>
    <linearGradient id="vol-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b12"/>
      <stop offset="50%" stop-color="#2a0e19"/>
      <stop offset="100%" stop-color="#12070c"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="840" fill="url(#vol-bg)"/>
  
  <rect x="40" y="40" width="1120" height="760" rx="14" fill="none" stroke="#f43f5e" stroke-width="2.5" opacity="0.8"/>
  <rect x="54" y="54" width="1092" height="732" rx="10" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Volunteer Header -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <text fill="#f43f5e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="2">&#10084; COMMUNITY VOLUNTEER SERVICE</text>
    <text y="42" fill="#fda4af" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">CERTIFICATE OF RECOGNITION &amp; APPRECIATION</text>
  </g>

  <!-- Candidate Details -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" letter-spacing="2">THIS CERTIFICATE IS HONORED TO</text>
    <text y="68" fill="#fbbf24" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="46" font-weight="800">KIDIST HAILEMICHAEL</text>
    <line x1="-240" y1="92" x2="240" y2="92" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
    <text y="132" fill="#f1f5f9" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17">in sincere gratitude for leadership, exceptional dedication, and mobilizing donors for the</text>
    <text y="185" fill="#f43f5e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800">Community Blood Donation Campaign</text>
  </g>

  <!-- Competencies Box -->
  <g transform="translate(600, 530)">
    <rect x="-460" y="0" width="920" height="96" rx="12" fill="#2d121c" stroke="#4c1d2d" stroke-width="1.5"/>
    <text x="-430" y="32" fill="#fb7185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INITIATIVE IMPACT &amp; SCOPE:</text>
    <text x="-430" y="60" fill="#fce7f3" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5">
      Civic Leadership • Volunteer Team Logistics • Donor Mobilization • Healthcare Community Support
    </text>
    <text x="-430" y="82" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="11.5">
      Issued by Local Community Volunteer Organization • Hawassa, Ethiopia
    </text>
  </g>

  <!-- Path instruction banner -->
  <g transform="translate(600, 715)">
    <rect x="-330" y="-20" width="660" height="40" rx="8" fill="#1f0b13" stroke="#4c1d2d" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
      📁 Placeholder: Replace at public/certificates/community-blood-donation-recognition.png
    </text>
  </g>
</svg>
