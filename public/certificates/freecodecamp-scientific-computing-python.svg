<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <defs>
    <linearGradient id="fcc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="50%" stop-color="#1b1b32"/>
      <stop offset="100%" stop-color="#0a0a23"/>
    </linearGradient>
    <linearGradient id="fcc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="fcc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="840" fill="url(#fcc-bg)"/>
  
  <!-- Certificate Border -->
  <rect x="40" y="40" width="1120" height="760" rx="14" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.8"/>
  <rect x="54" y="54" width="1092" height="732" rx="10" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- FCC Header -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="2">freeCodeCamp ( &#9906; )</text>
    <text y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">VERIFIED ACADEMIC &amp; PROGRAMMING CERTIFICATE</text>
  </g>

  <!-- Candidate Details -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" letter-spacing="2">THIS CERTIFIES THAT</text>
    <text y="68" fill="#facc15" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="46" font-weight="800">KIDIST HAILEMICHAEL</text>
    <line x1="-240" y1="92" x2="240" y2="92" stroke="#facc15" stroke-width="2" opacity="0.6"/>
    <text y="132" fill="#e2e8f0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17">has successfully completed developer certification requirements for</text>
    <text y="185" fill="#10b981" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800">Scientific Computing with Python</text>
  </g>

  <!-- Competencies Box -->
  <g transform="translate(600, 530)">
    <rect x="-460" y="0" width="920" height="96" rx="12" fill="#1b1b32" stroke="#374151" stroke-width="1.5"/>
    <text x="-430" y="32" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CORE SKILLS &amp; PROJECTS:</text>
    <text x="-430" y="60" fill="#e5e7eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5">
      Python Algorithmic Foundations • Scientific Computing • Data Structures • Complex OOP Systems
    </text>
    <text x="-430" y="82" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11.5">
      Credential: freecodecamp.org/certification/kidist21/python-v9
    </text>
  </g>

  <!-- Path instruction banner -->
  <g transform="translate(600, 715)">
    <rect x="-330" y="-20" width="660" height="40" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
      📁 Placeholder: Replace at public/certificates/freecodecamp-scientific-computing-python.png
    </text>
  </g>
</svg>
